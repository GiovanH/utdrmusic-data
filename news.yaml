Content: |-
    Aren't you excited?<br>Aren't you happy?<br>You're going to be free.

    <hr class="split">

    Welcome to UTDRMusic Wiki, a fan-made UNDERTALE & DELTARUNE music wiki!

    UNDERTALE & DELTARUNE's music is made up of some of the most recognizable video game compositions of recent years. Toby Fox, already known in some circles for [his work on Homestuck](https://hsmusic.wiki/artist/toby-fox), suddenly became one of the most successful video game composers (even being featured in [Pokémon](https://hsmusic.wiki/track/battle-battle-tower/) and [Super Smash Bros](https://hsmusic.wiki/track/megalovania-ssbu/)).

    Further, it spawned a vibrant creative community around it. Much as Homestuck spawned a [fanmusic scene](https://hsmusic.wiki/group/fandom/), many independent creators have found success after working on tributes to UNDERTALE. Artists like [[artist:noteblock]] and [[artist:familyjules]] became known for their remixes before working on their own projects, sometimes even [collaborating with Toby himself](https://hsmusic.wiki/track/skies-forever-blue/). However, while groups like [the Unofficial MSPA Fans](https://hsmusic.wiki/group/unofficial-mspa-fans/) organized albums featuring Homestuck fanmusicians with increasing professionalism, the majority of UNDERTALE fanmusic is spread across many places over many years.

    Homestuck still wasn't immune to this problem, and the [HSMusic Wiki](https://hsmusic.wiki/) was founded by Quasar Nebula to platform and preserve it. It has long cataloged [non-Homestuck works](https://hsmusic.wiki/group/beyond/) by its notable musicians, [UNDERTALE included](https://hsmusic.wiki/album/undertale-soundtrack/), but fanmusic was largely never included. I decided to start this wiki to help achieve the same goals for another community, and celebrate UNDERTALE's legacy.

    Personally, both UNDERTALE and Homestuck's music means quite a lot to me. I can barely remember a time when I *wasn't* regularly humming [[track:hopes-and-dreams]], or melodies like [Sunsetter](https://hsmusic.wiki/track/sunsetter/). The Homestuck fanmusic community has stayed lively even nearly a decade after the comic proper ended, and UNDERTALE arrangements still make up a sizable portion of my listens on sites like YouTube.

    While this wiki is currently small, contributing to it is [[static:feedback|something anyone can do]]. Ideally, through the coming months and years, it will extend to the same level of encyclopedic coverage of fan efforts as has been achieved for HSMusic. Even people no longer active with Homestuck regularly browse and share that wiki with friends!

    HSMusic has already inspired people to get involved creating musical projects of their own. Today, [[album:kindred-souls]] was released, a celebration of the Homestuck and UNDERTALE fanmusic communities that promises much more to come from both in the future. With luck, this wiki can be part of that.

    See [[static:about]] for a somewhat abbreviated version of this page, with credits added.

