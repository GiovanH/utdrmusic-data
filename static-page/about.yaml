Name: About & Credits
Directory: about
Content: |-
    Welcome to UTDRMusic Wiki, a fan-made UNDERTALE & DELTARUNE music wiki!

    UNDERTALE & DELTARUNE's music is made up of some of the most recognizable video game compositions of recent years. Toby Fox, already known in some circles for [his work on Homestuck](https://hsmusic.wiki/artist/toby-fox), suddenly became one of the most successful video game composers (even being featured in [Pokémon](https://hsmusic.wiki/track/battle-battle-tower/) and [Super Smash Bros](https://hsmusic.wiki/track/megalovania-ssbu/)).

    Further, it spawned a vibrant creative community around it. Much as Homestuck spawned a [fanmusic scene](https://hsmusic.wiki/group/fandom/), many independent creators have found success after working on tributes to UNDERTALE. Artists like [[artist:noteblock]] and [[artist:familyjules]] became known for their remixes before working on their own projects, sometimes even [collaborating with Toby himself](https://hsmusic.wiki/track/skies-forever-blue/). However, while groups like [the Unofficial MSPA Fans](https://hsmusic.wiki/group/unofficial-mspa-fans/) organized albums featuring Homestuck fanmusicians with increasing professionalism, the majority of UNDERTALE fanmusic is spread across many places over many years.

    Homestuck still wasn't immune to this problem, and the [HSMusic Wiki](https://hsmusic.wiki/) was founded by Quasar Nebula to platform and preserve it. It has long cataloged [non-Homestuck works](https://hsmusic.wiki/group/beyond/) by its notable musicians, [UNDERTALE included](https://hsmusic.wiki/album/undertale-soundtrack/), but fanmusic was largely never included. This wiki was eventually created to help achieve the same goals for another community.

    *Credits*
    - [leo vriska](https://60228.dev/@leo): I started this effort! I definitely can't claim even the majority of the work, but....
    - [Quasar Nebula](https://hsmusic.wiki/feedback/): Started HSMusic Wiki! This wiki wouldn't exist without them.
    - [[artist:ruby]]: Extensive contributions to Toby Fox's works for both HSMusic and this wiki! She's really done more than me for making this wiki actually a thing, honestly.
    - [Every other HSMusic contributor](https://hsmusic.wiki/changelog/): This wiki wouldn't exist without them! I can't express enough how important they are to the Homestuck music community.
    - [Undertale](https://undertale.wiki) and [Deltarune wikis](https://undertale.wiki): It would be remiss not to shout these out. While I don't think *this* wiki's development directly used any material from them, they were an important resource for the original album additions on HSMusic before they were imported here.
    - [Undertale Yellow wiki](https://undertaleyellow.wiki.gg/): Similarly, this wiki provided a great starting point for research on the [[album:undertale-yellow-soundtrack]].
